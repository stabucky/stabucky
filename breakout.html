<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ブロック崩し</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e8ecff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  canvas{background:#111a33;border:2px solid #2b3a6b;border-radius:8px;max-width:100vw;max-height:88vh}
  #hud{width:min(100vw,480px);display:flex;justify-content:space-between;padding:6px 10px;box-sizing:border-box;font-size:14px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="score">スコア 0</span><span id="level">ステージ 1</span><span id="lives">残機 ♥♥♥</span></div>
  <canvas id="c" width="480" height="640"></canvas>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLS = 8, ROWS_BASE = 4, BW = W / COLS, BH = 24, TOP = 60;
const COLORS = ['#ff5d73', '#ff9f5d', '#ffd95d', '#6be58a', '#5dc8ff', '#a98bff'];

let paddle, ball, bricks, score, lives, level, state; // state: ready | play | over | clear
let keys = {}, targetX = null;

function buildBricks() {
  bricks = [];
  const rows = Math.min(ROWS_BASE + level, 8);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: c * BW, y: TOP + r * BH, hp: r < level - 1 ? 2 : 1, color: COLORS[r % COLORS.length] });
}
function resetBall() {
  ball = { x: W / 2, y: H - 60, r: 8, vx: 0, vy: 0 };
  state = 'ready';
}
function newGame() {
  score = 0; lives = 3; level = 1;
  paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 36 };
  buildBricks(); resetBall(); updateHud();
}
function launch() {
  const sp = 5 + level * 0.5;
  const a = (Math.random() * 0.6 - 0.3);
  ball.vx = sp * Math.sin(a); ball.vy = -sp * Math.cos(a);
  state = 'play';
}
function updateHud() {
  document.getElementById('score').textContent = 'スコア ' + score;
  document.getElementById('level').textContent = 'ステージ ' + level;
  document.getElementById('lives').textContent = '残機 ' + '♥'.repeat(Math.max(lives, 0));
}

function step() {
  // paddle control
  if (keys.ArrowLeft) paddle.x -= 8;
  if (keys.ArrowRight) paddle.x += 8;
  if (targetX !== null) paddle.x += (targetX - paddle.w / 2 - paddle.x) * 0.4;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (state === 'ready') { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }
  if (state !== 'play') return;

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

  // paddle: bounce angle depends on hit position
  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const sp = Math.hypot(ball.vx, ball.vy) * 1.01;
    const a = hit * 1.05;
    ball.vx = sp * Math.sin(a); ball.vy = -sp * Math.cos(a);
    ball.y = paddle.y - ball.r;
  }

  // bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
      const ox = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
      if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
      b.hp--; score += 10; updateHud();
      break;
    }
  }
  if (bricks.every(b => b.hp <= 0)) { state = 'clear'; return; }

  // lost ball
  if (ball.y - ball.r > H) {
    lives--; updateHud();
    if (lives <= 0) state = 'over'; else resetBall();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.hp > 1 ? '#c9cfe8' : b.color;
    ctx.fillRect(b.x + 2, b.y + 2, BW - 4, BH - 4);
  }
  ctx.fillStyle = '#e8ecff';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();

  const msg = { ready: 'タップ / スペースで発射', over: 'ゲームオーバー\nタップでもう一度', clear: 'ステージクリア！\nタップで次へ' }[state];
  if (msg) {
    ctx.fillStyle = 'rgba(11,16,32,.65)'; ctx.fillRect(0, H / 2 - 50, W, 100);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'center';
    msg.split('\n').forEach((l, i, a) => ctx.fillText(l, W / 2, H / 2 + (i - (a.length - 1) / 2) * 32 + 8));
  }
}

function action() {
  if (state === 'ready') launch();
  else if (state === 'over') newGame();
  else if (state === 'clear') { level++; buildBricks(); resetBall(); updateHud(); }
}

function pos(e) {
  const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  return (t.clientX - r.left) * (W / r.width);
}
cv.addEventListener('mousemove', e => targetX = pos(e));
cv.addEventListener('touchmove', e => { targetX = pos(e); e.preventDefault(); }, { passive: false });
cv.addEventListener('touchstart', e => { targetX = pos(e); action(); e.preventDefault(); }, { passive: false });
cv.addEventListener('mousedown', action);
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') { action(); e.preventDefault(); } });
addEventListener('keyup', e => keys[e.key] = false);

newGame();
(function loop() { step(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
